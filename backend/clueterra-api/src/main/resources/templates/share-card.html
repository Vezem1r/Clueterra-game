<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --w: 1200px;
      --h: 630px;
      --accent: {{ACCENT}};
      --accent-rgb: {{ACCENT_RGB}};
      --glow-1: {{GLOW_1}};
      --glow-2: {{GLOW_2}};
      --pill-border: {{PILL_BORDER}};
      --pill-bg: {{PILL_BG}};
      --pill-color: {{PILL_COLOR}};
      --pill-shadow: {{PILL_SHADOW}};
      --tile: {{TILE_SIZE}}px;
      --tile-gap: {{TILE_GAP}}px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: var(--w);
      height: var(--h);
      background: #000;
      overflow: hidden;
    }

    .card {
      width: var(--w);
      height: var(--h);
      position: relative;
      overflow: hidden;
      color: #f5f7fb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background:
        radial-gradient(800px 500px at 50% 18%, var(--glow-1), transparent 60%),
        radial-gradient(600px 400px at 82% 92%, var(--glow-2), transparent 62%),
        linear-gradient(135deg, #071521 0%, #060914 48%, #0b0b12 100%);
      isolation: isolate;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: linear-gradient(105deg, transparent 18%, rgba(var(--accent-rgb), .12) 34%, rgba(var(--accent-rgb), .04) 44%, transparent 57%);
      filter: blur(18px);
      transform: rotate(-3deg);
      opacity: .9;
      z-index: -2;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at center, black 0%, black 40%, transparent 80%);
      opacity: .25;
      z-index: -1;
    }

    /* ── META: top corners ── */
    .meta {
      position: absolute;
      top: 30px;
      left: 0;
      right: 0;
      padding: 0 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(218, 228, 241, .36);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: .03em;
    }

    .brand svg { opacity: .45; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 22px;
      border-radius: 999px;
      border: 1px solid var(--pill-border);
      background: var(--pill-bg);
      color: var(--pill-color);
      font-weight: 800;
      letter-spacing: .16em;
      font-size: 14px;
      text-transform: uppercase;
      box-shadow: var(--pill-shadow);
    }

    /* ── TILES: hero ── */
    .tiles-wrap {
      position: relative;
    }

    .tiles-wrap::before {
      content: "";
      position: absolute;
      inset: -52px -44px;
      border-radius: 48px;
      background: radial-gradient(ellipse at center, rgba(var(--accent-rgb), .12), transparent 68%);
      filter: blur(24px);
      z-index: 0;
    }

    .tiles {
      --n: {{TILE_COUNT}};
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(var(--n), var(--tile));
      gap: var(--tile-gap);
    }

    .tile {
      width: var(--tile);
      height: var(--tile);
      border-radius: 24px;
      position: relative;
      border: 1.5px solid rgba(255,255,255,.13);
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(255,255,255,.30), transparent 42%, rgba(0,0,0,.10));
      pointer-events: none;
    }

    .tile.first {
      background: linear-gradient(145deg, #4be48e 0%, #21d087 45%, #11aa6a 100%);
      box-shadow: 0 0 48px rgba(46,240,189,.46), 0 12px 28px rgba(0,0,0,.24);
    }
    .tile.try2 {
      background: linear-gradient(145deg, #ffe464 0%, #ffc43d 44%, #d99510 100%);
      box-shadow: 0 0 48px rgba(255,196,61,.40), 0 12px 28px rgba(0,0,0,.24);
    }
    .tile.try3 {
      background: linear-gradient(145deg, #ffd051 0%, #f3a71f 52%, #c6790c 100%);
      box-shadow: 0 0 48px rgba(255,176,38,.36), 0 12px 28px rgba(0,0,0,.24);
    }
    .tile.try4 {
      background: linear-gradient(145deg, #ffba43 0%, #e68c18 50%, #a95d0c 100%);
      box-shadow: 0 0 48px rgba(255,151,34,.32), 0 12px 28px rgba(0,0,0,.24);
    }
    .tile.missed {
      background: linear-gradient(145deg, #ff5966 0%, #eb2e47 47%, #9c182c 100%);
      box-shadow: 0 0 48px rgba(255,67,87,.40), 0 12px 28px rgba(0,0,0,.24);
    }

    /* ── XP + CHALLENGE ── */
    .xp-line {
      text-align: center;
      font-size: 76px;
      font-weight: 950;
      letter-spacing: -.04em;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 48px rgba(var(--accent-rgb), .32);
    }

    .xp-line .xp-unit {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: .01em;
      margin-left: 2px;
    }

    .hook {
      text-align: center;
      font-size: 40px;
      font-weight: 700;
      color: rgba(218, 228, 241, .58);
      letter-spacing: -.01em;
      margin-top: -6px;
    }

    /* ── STATS: secondary ── */
    .stats {
      display: flex;
      align-items: baseline;
      gap: 20px;
      color: rgba(218, 228, 241, .40);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .stats .val {
      color: rgba(218, 228, 241, .65);
      font-weight: 900;
    }

    .stats .val .dim { opacity: .40; }

    .stats .dot {
      opacity: .30;
    }

    /* ── FOOTER ── */
    .footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: rgba(var(--accent-rgb), .50);
      letter-spacing: .06em;
    }

    svg { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="meta">
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
          <path d="M2 12h20"/>
        </svg>
        <span>Clueterra · {{DATE}}</span>
      </div>
      <div class="pill">
        {{DIFFICULTY_ICON}}
        <span>{{DIFFICULTY}}</span>
      </div>
    </div>

    <div class="tiles-wrap">
      <div class="tiles">
        {{TILES_HTML}}
      </div>
    </div>

    <div class="xp-line">{{XP}} <span class="xp-unit">XP</span></div>
    <div class="hook">{{CHALLENGE}}</div>

    <div class="stats">
      <span><span class="val">{{TIME_HTML}}</span> time</span>
      <span class="dot">·</span>
      <span><span class="val">{{HINTS}}</span> hints</span>
      {{STREAK_STAT}}
    </div>

    <div class="footer">clueterra.com</div>
  </main>
</body>
</html>
