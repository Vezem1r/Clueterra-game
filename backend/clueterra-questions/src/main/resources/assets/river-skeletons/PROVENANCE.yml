local_modifications: "HydroRIVERS reaches of Strahler order 4 or greater are clipped to a geographic context rectangle, simplified after projection, and grouped by river system and order. Every clue uses the same 800x520 canvas, while bright focus rectangles follow the exact bounding boxes of geographically distinct major landmasses. A river reach is highlighted only if it intersects the country polygon; its continuation beyond the polygon stays intact, while unrelated rivers remain dim even inside the rectangle. Detail budgets are separate for focus and context: the focus retains long and significant river systems across Strahler orders instead of dropping whole orders. Country polygons are used for river-quality eligibility, focus bounding boxes, highlighted-reach selection and Natural Earth label selection, not to crop the rendered network. Natural Earth supplies verified major-river labels only. Easy assets label three rivers, medium assets label one, and hard assets contain no labels."
scope: "All *-easy.svg, *-medium.svg and *-hard.svg files in this directory"
selection: "158 of 250 active Clueterra country and territory codes passed the minimum rendered-network quality gate."
limitations: "HydroRIVERS is a model-derived global network and is not a complete local hydrographic or navigational dataset; its source documentation notes lower quality above 60 degrees north. Natural Earth labels are generalized and labels matching the country name are excluded."
