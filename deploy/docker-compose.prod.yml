networks:
  frontend-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend-net:
  platform-postgres-net:
    external: true
    name: platform-postgres-net
  platform-minio-net:
    external: true
    name: platform-minio-net
  platform-monitoring-net:
    external: true
    name: platform-monitoring-net

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

x-hardened: &hardened
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  redis:
    image: ${CLUETERRA_REDIS_IMAGE:-redis:7-alpine}
    container_name: clueterra-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging
    <<: *hardened
    user: redis
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 64
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: ${CLUETERRA_REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.92.0}
    container_name: clueterra-redis-exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend-net
      - platform-monitoring-net
    <<: *hardened
    deploy:
      resources:
        limits:
          memory: 96M
          pids: 64
    depends_on:
      redis:
        condition: service_healthy
        restart: true

  embeddings:
    image: ${CLUETERRA_EMBEDDINGS_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    container_name: clueterra-embeddings
    restart: unless-stopped
    command:
      - --model-id
      - BAAI/bge-small-en-v1.5
      - --revision
      - 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - --max-client-batch-size
      - "32"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
    logging: *default-logging
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
    volumes:
      - embeddings_model_cache:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
          pids: 128

  api:
    image: ${CLUETERRA_API_IMAGE:-clueterra-api:local}
    build:
      context: ..
      dockerfile: backend/clueterra-api/Dockerfile
    container_name: clueterra-api
    restart: unless-stopped
    stop_grace_period: 35s
    logging: *default-logging
    <<: *hardened
    tmpfs:
      - /tmp:exec,size=512m
      - /home/appuser/.cache:size=16m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: UTC
      JAVA_OPTS: "-Xmx2304m -XX:+UseContainerSupport -Duser.timezone=UTC"
      DB_HOST: platform-postgres
      DB_PORT: 5432
      DB_NAME: clueterra
      DB_USER: clueterra
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_KEY_SALT: ${RATE_LIMIT_KEY_SALT}
      TOTP_ENABLED: ${TOTP_ENABLED:-true}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      QUESTIONS_SERVICE_SECRET: ${QUESTIONS_SERVICE_SECRET}
      QUESTIONS_SERVICE_URL: http://questions:8081
      BUDGET_SERVICE_SECRET: ${BUDGET_SERVICE_SECRET}
      BUDGET_SERVICE_URL: http://budget:8082
      CORS_ORIGINS: https://${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
      BACKEND_BASE_URL: https://${DOMAIN}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MINIO_ENDPOINT: http://platform-minio:9000
      MINIO_PUBLIC_ENDPOINT: https://${DOMAIN}/storage
      MINIO_API_SECRET_KEY: ${MINIO_API_SECRET_KEY}
      MAPILLARY_CLIENT_TOKEN: ${MAPILLARY_CLIENT_TOKEN:-}
      TRUSTED_PROXIES: 172.30.0.10,172.30.0.11
    volumes:
      - ./logs/api:/app/logs
    networks:
      - frontend-net
      - backend-net
      - platform-monitoring-net
      - platform-postgres-net
      - platform-minio-net
    deploy:
      resources:
        limits:
          memory: 3G
          pids: 1024
    depends_on:
      redis:
        condition: service_healthy
        restart: true

  questions:
    image: ${CLUETERRA_QUESTIONS_IMAGE:-clueterra-questions:local}
    build:
      context: ..
      dockerfile: backend/clueterra-questions/Dockerfile
    container_name: clueterra-questions
    restart: unless-stopped
    stop_grace_period: 35s
    logging: *default-logging
    <<: *hardened
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: UTC
      JAVA_OPTS: "-Xmx3072m -XX:+UseContainerSupport -Duser.timezone=UTC"
      DB_HOST: platform-postgres
      DB_PORT: 5432
      DB_NAME: clueterra
      DB_USER: clueterra
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QUESTIONS_SERVICE_SECRET: ${QUESTIONS_SERVICE_SECRET}
      MINIO_ENDPOINT: http://platform-minio:9000
      MINIO_PUBLIC_ENDPOINT: https://${DOMAIN}/storage
      MINIO_QUESTIONS_SECRET_KEY: ${MINIO_QUESTIONS_SECRET_KEY}
      CLUETERRA_AI_API_KEY: ${CLUETERRA_AI_API_KEY}
      LOCAL_EMBEDDING_BASE_URL: http://embeddings:80
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEONAMES_USERNAME: ${GEONAMES_USERNAME:-}
      MAPILLARY_CLIENT_TOKEN: ${MAPILLARY_CLIENT_TOKEN:-}
    volumes:
      - ./logs/questions:/app/logs
    networks:
      - backend-net
      - platform-monitoring-net
      - platform-postgres-net
      - platform-minio-net
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 1024
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      embeddings:
        condition: service_healthy

  budget:
    image: ${CLUETERRA_BUDGET_IMAGE:-clueterra-budget:local}
    build:
      context: ..
      dockerfile: backend/clueterra-budget/Dockerfile
    container_name: clueterra-budget
    restart: unless-stopped
    stop_grace_period: 35s
    logging: *default-logging
    <<: *hardened
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health/readiness | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: UTC
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseContainerSupport -Duser.timezone=UTC"
      DB_HOST: platform-postgres
      DB_PORT: 5432
      DB_NAME: clueterra
      BUDGET_DB_USER: clueterra_budget
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BUDGET_SERVICE_SECRET: ${BUDGET_SERVICE_SECRET}
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://platform-minio:9000
      MINIO_BUDGET_SECRET_KEY: ${MINIO_BUDGET_SECRET_KEY}
    volumes:
      - ./logs/budget:/app/logs
    networks:
      - backend-net
      - platform-monitoring-net
      - platform-postgres-net
      - platform-minio-net
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 512
    depends_on:
      redis:
        condition: service_healthy
        restart: true

  frontend-ssr:
    image: ${CLUETERRA_FRONTEND_SSR_IMAGE:-clueterra-frontend-ssr:local}
    build:
      context: ../frontend
      target: ssr
    container_name: clueterra-frontend-ssr
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *default-logging
    <<: *hardened
    environment:
      API_ORIGIN: http://api:8080
      SITE_ORIGIN: https://${DOMAIN}
    networks:
      frontend-net:
        ipv4_address: 172.30.0.11
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q '^OK$' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

  frontend:
    image: ${CLUETERRA_FRONTEND_IMAGE:-clueterra-frontend:local}
    build:
      context: ../frontend
      target: static
    container_name: clueterra-frontend
    restart: unless-stopped
    logging: *default-logging
    <<: *hardened
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /run:size=1m
      - /var/cache/nginx:size=64m
    volumes:
      - frontend_assets:/usr/share/nginx/html/assets
      - frontend_map_tiles:/var/cache/map-tiles
      - ./logs/frontend:/var/log/clueterra
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '^OK$' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    ports:
      - "127.0.0.1:8088:80"
    environment:
      MINIO_HOST: platform-minio
      SSR_HOST: frontend-ssr
      SSR_PORT: 3000
      ASSET_RETENTION_HOURS: "72"
    networks:
      frontend-net:
        ipv4_address: 172.30.0.10
      platform-minio-net:
    depends_on:
      api:
        condition: service_healthy
      frontend-ssr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128

  cloudflared:
    image: ${CLUETERRA_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.3}
    container_name: clueterra-cloudflared
    restart: unless-stopped
    logging: *default-logging
    <<: *hardened
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - frontend-net
    depends_on:
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128

volumes:
  redis_data:
  embeddings_model_cache:
    name: clueterra_tei_cache
  frontend_assets:
    name: clueterra_frontend_assets
  frontend_map_tiles:
    name: clueterra_frontend_map_tiles
